<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Synology Photos Kiosk</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:#000; overflow:hidden; }
    .slide { 
      position:absolute; top:0; left:0; width:100vw; height:100vh; 
      object-fit:contain; opacity:0; transition:opacity 1s ease-in-out; 
      background:#000;
    }
    .active { opacity:1; z-index:2; }
    .bg { opacity:0.3; filter:blur(20px) brightness(0.4); z-index:1; }
    #status { 
      position:absolute; bottom:20px; left:50%; transform:translateX(-50%); 
      color:#fff; background:rgba(0,0,0,0.6); padding:6px 14px; 
      border-radius:20px; font:12px/1 sans-serif; z-index:10; 
      opacity: 0; transition: opacity 0.5s; pointer-events: none;
    }
  </style>
</head>
<body>
  <img id="bg" class="slide bg" alt="">
  <img id="img1" class="slide active" alt="">
  <img id="img2" class="slide" alt="">
  <div id="status"></div>
  
  <script>
    let photos = [], idx = 0, timer, imageSize = 'xl', interval = 5000;
    const [img1, img2, bg] = ['img1', 'img2', 'bg'].map(id => document.getElementById(id));
    const status = document.getElementById('status');

    function setStatus(msg, hideAfter = 0) {
      status.textContent = msg;
      status.style.opacity = '1';
      if (hideAfter > 0) setTimeout(() => { status.style.opacity = '0'; }, hideAfter);
    }

   function loadNext() {
  if (!photos || !photos.length) return;

  const photo = photos[idx % photos.length];
  const photoId = photo && photo.id ? photo.id : photo;
  const cacheKey = photo && photo.cache_key ? photo.cache_key : '';
  
  const cur = img1.classList.contains('active') ? img1 : img2;
  const nxt = cur === img1 ? img2 : img1;

  const url = `/api/image?id=${encodeURIComponent(photoId)}&size=${imageSize}${cacheKey ? '&cache_key=' + encodeURIComponent(cacheKey) : ''}`;

  const timeout = setTimeout(() => nxt.dispatchEvent(new Event('error')), 15000);

  nxt.onload = function() {
    clearTimeout(timeout);
    bg.src = nxt.src;
    cur.classList.remove('active');
    nxt.classList.add('active');
    setStatus(`${idx + 1} / ${photos.length}`, 3000);
    idx = (idx + 1) % photos.length;
    
    //  Dynamic timing: GIFs get 10s, static images use config interval
    const isGif = photo.filename && photo.filename.toLowerCase().endsWith('.gif');
    const nextDelay = isGif ? (config.gifDisplayTime || 10000) : interval;
    timer = setTimeout(loadNext, nextDelay); //  Schedule next slide
  };

  nxt.onerror = function() {
    clearTimeout(timeout);
    setStatus(' Load failed, skipping...', 2000);
    idx = (idx + 1) % photos.length;
    timer = setTimeout(loadNext, interval);
  };

  nxt.src = url;
}

    function loop() {
  //  Start at random position immediately
  idx = Math.floor(Math.random() * (photos.length || 1));
  loadNext();
  // Interval will be set dynamically inside loadNext()
}

   async function load() {
  try {
    setStatus('Loading settings...', 2000);
    const cfg = await fetch('/api/config').then(r => r.json());
    imageSize = cfg.imageSize || 'xl';
    interval = cfg.slideshowInterval || 5000;

    setStatus('Fetching photos...', 2000);
    const r = await fetch('/api/photos?t=' + Date.now());
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const d = await r.json();
    if (d.error) throw new Error(d.error);

    photos = d.ids || d.urls || d.photos || [];
    if (!Array.isArray(photos) || photos.length === 0) {
      setStatus('No photos selected', 5000);
      setTimeout(load, 30000);
      return;
    }

    //  Shuffle once
    if (cfg.shuffle) {
      for (let i = photos.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [photos[i], photos[j]] = [photos[j], photos[i]];
      }
    }

    idx = 0;
    clearInterval(timer);
    setStatus(`Ready: ${photos.length} photos`, 3000);
    
    //  Start slideshow IMMEDIATELY (don't wait for preloading)
    loop();

  } catch(e) {
    console.error('Slideshow error:', e);
    setStatus(`Error: ${e.message}. Retrying...`, 5000);
    setTimeout(load, 30000);
  }
}
    document.addEventListener('DOMContentLoaded', load);
  </script>
</body>
</html>
